<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verification Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#FCFCFE; --bg2:#F0EFFA; --card:#FFFFFF; --card-2:#F7F7FC;
  --ink:#131320; --ink-2:#5A5A70; --ink-3:#8B8BA3; --line:#EAE9F4;
  --violet:#6C5CE7; --violet-2:#8B7CF0; --violet-soft:#F0EDFE;
  --sage:#1F9D74; --sage-soft:#E6F6F0; --clay:#D2695E; --clay-soft:#FCEDEB;
  --sans:"Plus Jakarta Sans","Noto Sans SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
  --r:20px; --rs:14px;
  --sh:0 1px 2px rgba(19,19,32,.04), 0 8px 26px rgba(80,70,180,.06);
  --sh-2:0 2px 6px rgba(19,19,32,.05), 0 18px 44px rgba(80,70,180,.10);
  --e:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
  background:linear-gradient(175deg,var(--bg1) 0%,var(--bg2) 100%);background-attachment:fixed;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--violet);text-decoration:none}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
::selection{background:var(--violet-soft)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex;animation:in .4s var(--e)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- top bar ---------- */
.bar{flex:none;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;
  max-width:1240px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:7px 14px 7px 9px;box-shadow:var(--sh);font-weight:600;font-size:13.5px;white-space:nowrap}
.brand .o{width:17px;height:17px;border-radius:50%;background:conic-gradient(from 210deg,var(--violet),#A9B4F5,#E8C6F2,var(--violet))}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:13px;
  font-weight:500;color:var(--ink-2);box-shadow:var(--sh);white-space:nowrap;transition:.18s var(--e)}
.pill:hover{color:var(--ink);transform:translateY(-1px)}
.pill.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;box-shadow:var(--sh);min-width:190px}
.search input{border:0;background:none;outline:none;font:inherit;font-size:13px;width:100%;color:var(--ink)}
.search input::placeholder{color:var(--ink-3)}
.search svg{color:var(--ink-3);flex:none}
@media(max-width:720px){.search{min-width:0;width:42px;padding:8px 11px}.search input{display:none}}

/* ---------- hall ---------- */
.scroll{flex:1;overflow-y:auto;padding:0 20px calc(env(safe-area-inset-bottom) + 40px)}
.wrap{max-width:1240px;margin:0 auto}
.hall-grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:980px){.hall-grid{grid-template-columns:1fr 330px}}

.hero{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:26px 28px 24px;box-shadow:var(--sh-2);overflow:hidden;min-height:330px;display:flex;flex-direction:column}
.orb{position:absolute;right:-40px;top:50%;transform:translateY(-50%);width:340px;height:340px;pointer-events:none;
  background:
    radial-gradient(circle at 38% 34%, rgba(255,255,255,.95) 0%, rgba(255,255,255,0) 42%),
    radial-gradient(circle at 62% 30%, rgba(163,148,255,.55) 0%, rgba(163,148,255,0) 55%),
    radial-gradient(circle at 32% 68%, rgba(126,196,255,.45) 0%, rgba(126,196,255,0) 58%),
    radial-gradient(circle at 70% 72%, rgba(226,178,255,.5) 0%, rgba(226,178,255,0) 60%),
    radial-gradient(circle at 50% 50%, rgba(236,234,255,.9) 0%, rgba(236,234,255,0) 70%);
  filter:blur(6px);border-radius:50%;animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateY(-52%) scale(1)}to{transform:translateY(-46%) scale(1.06)}}
@media(max-width:700px){.orb{width:230px;height:230px;right:-70px;opacity:.85}}
.chip{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;background:var(--card-2);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.hero h1{position:relative;font-size:clamp(30px,4.6vw,44px);line-height:1.08;letter-spacing:-.035em;font-weight:800;
  margin:18px 0 12px;max-width:15ch}
.hero p{position:relative;color:var(--ink-2);max-width:34ch;margin:0 0 auto;font-size:15.5px}
.tags{position:relative;display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 16px}
.tag{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.go{position:relative;align-self:flex-start;display:inline-flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 18px;font-weight:600;font-size:14px;box-shadow:var(--sh);
  transition:.2s var(--e)}
.go .arw{width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;transition:.2s var(--e)}
.go:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.go:hover .arw{background:var(--violet)}

.side{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);
  display:flex;flex-direction:column}
.side-h{display:flex;align-items:center;justify-content:space-between;margin:2px 4px 12px}
.side-h b{font-size:14px;font-weight:600}
.side-h a,.side-h button{font-size:12px;color:var(--ink-3)}
.rlist{display:grid;gap:4px}
.ritem{display:grid;grid-template-columns:1fr 62px;gap:12px;align-items:center;padding:9px 8px;border-radius:var(--rs);
  text-align:left;transition:.18s var(--e)}
.ritem:hover{background:var(--card-2)}
.ritem .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);display:block}
.ritem .t{font-size:13.5px;font-weight:600;line-height:1.3;display:block;margin-top:3px}
.ritem .d{font-size:12px;color:var(--ink-3);display:block;line-height:1.35;margin-top:2px}
.ritem img{width:62px;height:46px;object-fit:cover;border-radius:9px;border:1px solid var(--line);background:var(--card-2)}

.rowhead{display:flex;align-items:baseline;justify-content:space-between;margin:26px 4px 12px}
.rowhead b{font-size:15px;font-weight:600}
.rowhead span{font-size:12.5px;color:var(--ink-3)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.mini{background:var(--card);border:1px solid var(--line);border-radius:var(--rs);overflow:hidden;box-shadow:var(--sh);
  text-align:left;transition:.2s var(--e);display:flex;flex-direction:column}
.mini:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.mini img{width:100%;height:104px;object-fit:cover;background:var(--card-2);border-bottom:1px solid var(--line)}
.mini .b{padding:11px 13px 13px}
.mini .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--ink-3)}
.mini .t{font-size:13.5px;font-weight:600;line-height:1.3;margin-top:4px}
.mini .d{font-size:12px;color:var(--ink-3);margin-top:3px}

/* ---------- stage ---------- */
.stage-bar{flex:none;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 20px 10px;
  max-width:1240px;width:100%;margin:0 auto}
.ico{width:34px;height:34px;flex:none;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:999px;color:var(--ink-2);box-shadow:var(--sh)}
.ico:hover{color:var(--ink)}
.ico.on{background:var(--violet);border-color:var(--violet);color:#fff}
.crumb{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticks{display:flex;gap:4px;flex:1;max-width:300px;margin:0 auto}
.tick{flex:1;height:3px;border-radius:99px;background:var(--line);padding:0;min-width:5px;transition:.3s var(--e)}
.tick.done{background:#C9C3F2}
.tick.now{background:var(--violet)}

.panelwrap{flex:1;overflow-y:auto;padding:6px 20px calc(env(safe-area-inset-bottom) + 96px)}
.panel{max-width:660px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-2);overflow:hidden;animation:in .35s var(--e)}
.shot{margin:0;background:var(--card-2);border-bottom:1px solid var(--line)}
.shot img{display:block;width:100%;height:auto}
.shot figcaption{font-size:12.5px;color:var(--ink-3);padding:9px 18px 11px;border-top:1px solid var(--line);background:var(--card)}
.glyph{display:grid;place-items:center;padding:28px 0 6px}
.glyph svg{width:112px;height:112px;color:var(--violet);opacity:.9}
.body{padding:22px 26px 26px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.head{font-size:clamp(23px,4.4vw,31px);line-height:1.1;letter-spacing:-.03em;font-weight:800;margin:0 0 12px;text-wrap:balance}
.head em{font-style:normal;color:var(--violet)}
.line{color:var(--ink-2);font-size:16px;margin:0;max-width:44ch}
.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
.badge{font-size:11.5px;border-radius:999px;padding:5px 11px;border:1px solid var(--line);color:var(--ink-2);background:var(--card-2)}
.badge.can{background:var(--sage-soft);border-color:#CCEBDF;color:var(--sage)}
.badge.cant{background:var(--clay-soft);border-color:#F4D6D2;color:var(--clay)}

.more{margin-top:20px;border-top:1px solid var(--line);padding-top:6px}
.more-t{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);padding:9px 0}
.more-t:hover{color:var(--violet)}
.more-t .car{transition:.3s var(--e)}
.more.open .more-t .car{transform:rotate(180deg)}
.more-b{display:none}
.more.open .more-b{display:block;animation:in .3s var(--e)}
.more-b ul{margin:2px 0 6px;padding:0;list-style:none;display:grid;gap:10px}
.more-b li{color:var(--ink-2);font-size:14px;line-height:1.55;padding-left:15px;position:relative}
.more-b li:before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--violet-soft);border:1px solid #D6CFFA}
.more-b b,.more-b strong{color:var(--ink);font-weight:600}
.inline{font-family:var(--mono);font-size:12.5px;background:var(--card-2);border:1px solid var(--line);padding:1px 6px;border-radius:6px}

.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.act{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font-size:13.5px;
  font-weight:500;color:var(--ink);box-shadow:var(--sh);transition:.18s var(--e);display:inline-flex;align-items:center;gap:7px}
.act:hover{transform:translateY(-1px);box-shadow:var(--sh-2);color:var(--violet)}
.act.key{background:var(--ink);border-color:var(--ink);color:#fff}
.act.key:hover{background:var(--violet);border-color:var(--violet);color:#fff}
.act:disabled{opacity:.4}
.code{font-family:var(--mono);font-size:12.5px;background:var(--card-2);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;margin-top:16px;color:var(--ink-2);word-break:break-word;text-align:left;width:100%;display:block;position:relative}
.code:hover{border-color:#D6CFFA;color:var(--ink)}
.code.done{border-color:var(--sage);background:var(--sage-soft)}

/* ---------- foot ---------- */
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;
  padding:12px 20px calc(env(safe-area-inset-bottom) + 16px);max-width:1240px;margin:0 auto;
  background:linear-gradient(to top,var(--bg2) 55%,rgba(240,239,250,0));pointer-events:none}
.foot>*{pointer-events:auto}
.nav{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;
  place-items:center;box-shadow:var(--sh);color:var(--ink)}
.nav:hover:not(:disabled){color:var(--violet);box-shadow:var(--sh-2)}
.nav:disabled{opacity:.3}
.count{margin:0 auto;font-family:var(--mono);font-size:11px;color:var(--ink-3)}

/* ---------- index ---------- */
.idx-h{margin:6px 4px 18px}
.idx-h h2{font-size:28px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px}
.idx-h p{color:var(--ink-2);margin:0;font-size:14.5px}
.fam{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin:26px 4px 10px}

/* ---------- demos ---------- */
.demo{background:var(--card-2);border:1px solid var(--line);border-radius:var(--rs);padding:15px;margin-top:18px}
.f{display:grid;gap:6px;margin-bottom:11px}
.f label{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.f input{padding:10px 12px;border:1px solid var(--line);background:var(--card);border-radius:10px;
  font-family:var(--mono);font-size:13.5px;width:100%;color:var(--ink);outline:none}
.f input:focus{border-color:var(--violet)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.read{font-family:var(--mono);font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--ink-2);
  border-top:1px solid var(--line);margin-top:13px;padding-top:12px}
.read b{color:var(--violet);font-weight:500}
.read i{color:var(--ink);font-style:normal}
.rng{width:100%;accent-color:var(--violet)}
.rngrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.rngrow output{font-family:var(--mono);font-size:13px;color:var(--violet);min-width:60px;text-align:right}
.drop{border:1px dashed #D6CFFA;background:var(--card);border-radius:12px;min-height:104px;display:grid;place-items:center;
  gap:6px;padding:20px;text-align:center;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--violet);background:var(--violet-soft)}
.drop .h{font-size:13px;font-weight:600}
.drop .s{font-size:12px;color:var(--ink-3)}
.cstage{position:relative;display:none;touch-action:none;user-select:none;line-height:0;border-radius:12px;overflow:hidden;background:#EDEBF7}
.cstage.on{display:block}
.cstage canvas{width:100%;height:auto;display:block}
.csel{position:absolute;border:2px solid var(--violet);box-shadow:0 0 0 9999px rgba(19,19,32,.35);display:none;border-radius:2px}
.csel.on{display:block}
.cout{margin-top:11px;display:none}
.cout.on{display:block}
.cout img{max-width:100%;border:1px solid var(--line);border-radius:10px;display:block}
.taps{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.tap{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);
  background:var(--card);border-radius:11px;font-size:13.5px;color:var(--ink-2);line-height:1.4;transition:.16s var(--e)}
.tap:hover{border-color:#D6CFFA;color:var(--ink)}
.tap .bx{flex:none;width:16px;height:16px;border:1px solid #CFCEE2;border-radius:5px;margin-top:2px;display:grid;
  place-items:center;font-size:10px;color:transparent}
.tap[aria-pressed=true]{border-color:var(--violet);background:var(--violet-soft);color:var(--ink)}
.tap[aria-pressed=true] .bx{background:var(--violet);border-color:var(--violet);color:#fff}
.opts{display:grid;gap:7px}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:13.5px;color:var(--ink-2);
  background:var(--card);line-height:1.4}
.opt:hover{border-color:#D6CFFA;color:var(--ink)}
.opt.right{border-color:var(--sage);background:var(--sage-soft);color:var(--ink)}
.opt.wrong{border-color:var(--clay);background:var(--clay-soft);color:var(--ink)}
.verdictline{font-size:18px;font-weight:600;line-height:1.35;border-left:3px solid var(--violet);padding-left:14px;margin-top:16px}
.logl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.logl li{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:grid;
  grid-template-columns:auto 1fr;gap:11px;font-size:13px;color:var(--ink-2)}
.logl .t{font-family:var(--mono);font-size:10.5px;color:var(--violet);padding-top:2px}
.logl .empty{display:block;text-align:center;color:var(--ink-3);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;background:var(--ink);color:#fff;font-size:12.5px;
  padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s;z-index:90}
.toast.on{opacity:1}
body.ed [data-b]{outline:1px dashed transparent;border-radius:6px}
body.ed [data-b]:hover{outline-color:#D6CFFA}
body.ed [data-b]:focus{outline:1px solid var(--violet);background:var(--violet-soft)}
</style>
</head>
<body>

<div id="app">
  <!-- HALL -->
  <section class="view on" id="v-hall">
    <div class="bar">
      <div class="brand"><span class="o"></span>Verification Desk</div>
      <div class="pills">
        <button class="pill on" data-jump="hall">Rooms</button>
        <button class="pill" data-jump="index">All tools</button>
      </div>
      <label class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search a tool or operator" aria-label="Search">
      </label>
    </div>
    <div class="scroll"><div class="wrap">
      <div class="hall-grid">
        <div class="hero">
          <div class="orb"></div>
          <span class="chip">Start here</span>
          <h1>Four rooms. One question each.</h1>
          <p>Take one at a time. Every room ends with something you can write down.</p>
          <div class="tags"><span class="tag">#reverseimage</span><span class="tag">#geolocation</span><span class="tag">#provenance</span></div>
          <button class="go" data-room="img">Enter the first room <span class="arw"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span></button>
        </div>
        <div class="side">
          <div class="side-h"><b>The rooms</b><button data-jump="index">All tools →</button></div>
          <div class="rlist" id="rooms"></div>
        </div>
      </div>
      <div class="rowhead"><b>Most used</b><span>Straight to the tool</span></div>
      <div class="cards" id="quick"></div>
    </div></div>
  </section>

  <!-- STAGE -->
  <section class="view" id="v-stage">
    <div class="stage-bar">
      <button class="ico" id="s-back" aria-label="Back">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span class="crumb" id="s-name"></span>
      <div class="ticks" id="s-ticks"></div>
      <button class="ico" id="s-edit" title="Edit text" aria-label="Edit">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L20 8l-4-4L4 16v4z"/></svg></button>
      <button class="ico" id="s-save" title="Save" aria-label="Save">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v6h7"/></svg></button>
    </div>
    <div class="panelwrap"><div id="s-panel"></div></div>

const ROOMS={"img": {"name": "Room I · The image", "steps": [{"art": "twoframes", "eye": "Room I · The image", "head": "Most breaking images are <em>old</em> images.", "line": "Before anything else, ask whether this picture has been online before.", "shot": {"f": "images/room-img-1.jpg", "c": "Old image? Ask why it is being shared now"}, "more": ["This is the cheapest check you have, and it settles more claims than every other tool combined.", "Clips with the highest view counts are usually not the original upload."]}, {"art": "crop", "head": "Crop to one detail.", "line": "A whole frame returns lookalikes. One distinctive detail returns the source.", "demo": "crop", "shot": {"f": "images/room-img-2.jpg", "c": "Blur or crop away the rest, then search the detail"}, "more": ["Blur or crop away whatever dominates the frame — a person, a watermark — and search what is left.", "Bing and Yandex have cropping built in. A screenshot of the region often works better than the file."]}, {"art": "fan", "head": "Ask all four.", "line": "They index different halves of the web and disagree constantly. That is the point.", "demo": "engines", "shot": {"f": "images/room-img-3.jpg", "c": "Six engines. They index different halves of the web"}, "more": ["<b>Lens</b> — widest index, reads text, and you can add a keyword to the image search.", "<b>TinEye</b> — sort by oldest; it tells you when the photo first appeared.", "<b>Yandex</b> — identical and similar faces, and easy on mobile.", "<b>Baidu</b> — images from Chinese sites, and it will name a public figure."]}, {"art": "timeline", "head": "Two more for the <em>Chinese</em> web.", "line": "360识图 at image.so.com, and 搜狗识图 at pic.sogou.com. Both find what Baidu misses.", "shot": {"f": "images/room-img-4.jpg", "c": "And two more, if the claim is Chinese"}, "more": ["Open the oldest hit you find and read its caption. The original context is usually the story.", "An earliest-indexed date is an upper bound: the image existed by then, not that it was taken then."]}, {"art": "empty", "head": "Empty is not <em>original</em>.", "line": "Low resolution, a flip, or an edit will all return nothing.", "shot": {"f": "images/room-img-5.jpg", "c": "Flipped, low-res or edited images return nothing"}, "more": ["Flip it horizontally. Crop somewhere else. Raise the contrast. Search a screenshot of it.", "For video, pull keyframes first and search each one separately."]}, {"art": "log", "head": "Then talk to the person.", "line": "Analyse the account first: who is it, and what did they post before this?", "shot": {"f": "images/room-img-6.jpg", "c": "Keep in mind: save the conversation, it can be deleted"}, "acts": [["Every reverse-search detail", "#tool/reverse-image"]], "more": ["Be empathetic, and never encourage a witness to put themselves at risk.", "Save the conversation — it can be deleted.", "Ask for the original file, not a re-share. That is where the metadata is."]}]}, "geo": {"name": "Room II · The place", "steps": [{"art": "scanframe", "eye": "Room II · The place", "head": "Ask four questions first.", "line": "When, where, in what language, and on which network will the results be?", "demo": "inventory", "shot": {"f": "images/room-geo-1.jpg", "c": "Ask first: when, where, in what language, on which network"}, "more": ["Witnesses rarely write like journalists. Most will name a street or a town, not a precise location."]}, {"art": "message", "head": "They won't name the <em>place</em>.", "line": "Witnesses type fast, often in shock. Most give you a town or a street, not a location.", "shot": {"f": "images/room-geo-2.jpg", "c": "Witnesses don't write like journalists. They name a street, not a place"}, "more": ["Search the street name plus the town before anything else — it frequently lands the spot outright.", "Breaking events elsewhere take a while to reach your algorithm. Search hashtags in the local language."]}, {"art": "intersect", "head": "One is a coincidence.", "line": "Five independent features pointing the same way is a geolocation.", "more": ["Search the text you found first — a shop name plus a city often lands it before you open a map.", "Confirm on satellite, then at street level, then on a second provider."]}, {"art": "sun", "head": "Shadows give you the <em>time</em>.", "line": "If you know where, the shadow direction tells you when. Test the claimed hour.", "demo": "sun", "more": ["Google Maps: layers → satellite → drag the yellow figure to a blue street for more capture dates.", "百度地图 has 全景图 and a time machine; right-click a point to search hotels and cafés nearby."]}, {"art": "offset", "head": "Chinese maps are <em>offset</em>.", "line": "By law. AMAP uses GCJ-02, Baidu BD-09, while GPS and EXIF use WGS-84.", "demo": "coords", "more": ["Drop a raw GPS pin on Baidu and you land on the wrong building — often over a kilometre out.", "Never quote a Baidu or AMAP coordinate as a GPS coordinate."]}, {"art": "maps", "head": "Never trust one map.", "line": "Imagery dates differ between providers. Confirm on a second before you commit.", "acts": [["Google Earth", "https://earth.google.com"], ["Yandex", "https://yandex.com/maps"], ["AMAP", "https://www.amap.com"], ["Baidu", "https://map.baidu.com"]], "more": ["AMAP is better on mobile and carries user-uploaded detail Google and Baidu do not.", "In China, property listings and VR 看房 tours are an unexpected source of interior and street views.", "Live cams — geological and meteorological agencies — can confirm conditions at a time."]}, {"art": "pincheck", "head": "Show your working.", "line": "List the matched features with a screenshot each. The pylon, the kerb, the sign.", "acts": [["Every mapping detail", "#tool/mapping"]]}]}, "ai": {"name": "Room III · The file", "steps": [{"art": "fork", "eye": "Room III · The file", "head": "Provenance before <em>detection</em>.", "line": "One reads a signature a real tool left behind. The other is a guess.", "shot": {"f": "images/room-ai-1.jpg", "c": "Provenance: who made it, and what edited it"}, "more": ["<b>Provenance</b> — C2PA Content Credentials and SynthID watermarks. Present and validating is strong evidence.", "<b>Detection</b> — Hive, Deepfake-o-Meter. A probability from pixel statistics. Triage, never evidence."]}, {"art": "filetags", "head": "Read the file where it sits.", "line": "Metadata and credentials, parsed on your device. Nothing is uploaded.", "demo": "inspect", "shot": {"f": "images/room-ai-2.jpg", "c": "What a file carries, when nothing has stripped it"}, "more": ["Ask for the original by email, Telegram, WeTransfer, or as a document. On WeChat use Save to Files, never Save Image.", "Telegram is the exception among messengers — it does not strip metadata."]}, {"art": "stripped", "head": "It can be <em>edited</em>.", "line": "Metadata is never sole proof. Use it to cross-check something else.", "shot": {"f": "images/room-ai-3.jpg", "c": "And why it is never sole proof"}, "more": ["Absence proves nothing either: screenshots and re-uploads strip credentials and EXIF.", "A file with no metadata is the normal case for anything off a social platform."]}, {"art": "gauge", "head": "A score is not a finding.", "line": "Drag it. The honest sentence barely changes between thirty and ninety.", "demo": "score", "shot": {"f": "images/room-ai-4.jpg", "c": "A probability score. Unreliable, with false positives"}, "more": ["Split the audio from the video and test each separately — the picture is often real and the voice is not.", "Run each detector several times, on different sections, using the highest-quality file you have."]}, {"art": "globe", "head": "Check the account too.", "line": "Has the name changed since it was created? Wayback, the URL, and Page transparency.", "demo": "domain", "shot": {"f": "images/room-ai-5.jpg", "c": "Imposter accounts: check when the name last changed"}, "more": ["A site registered three weeks ago claiming a decade of history is the story.", "For groups and pages, the history section shows every rename."]}, {"art": "method", "head": "Publish the method.", "line": "What you did, what each tool returned, what you confirmed independently.", "shot": {"f": "images/room-ai-6.jpg", "c": "Detection tools, clues, the source, other sources — then you write it up"}, "acts": [["Every AI and provenance tool", "#tool/ai-detection"]], "more": ["Never publish the percentage as a finding.", "Cross-check with reliable sources, look for witnesses at other angles and timestamps, and talk to experts."]}]}, "case": {"name": "Room IV · The case", "steps": [{"art": "message", "eye": "Room IV · A worked case", "head": "08:14. A clip arrives.", "line": "“昨晚新山大水灾” — flooding in Johor Bahru last night. Your producer wants it at ten.", "demo": "brief", "shot": {"f": "images/room-case-1.jpg", "c": "What you have to establish: not recycled, really this event, and who shared it"}, "more": ["<b>Training scenario.</b> The incident is invented so you can practise the sequence. The tools and the arithmetic are real."]}, {"art": "clockid", "head": "Cheapest check first.", "line": "A TikTok video ID carries its own upload time. Decode it before anything else.", "demo": "tiktok", "shot": {"f": "images/room-case-2.jpg", "c": "TikTok hides the exact upload time. The tool decodes it"}, "more": ["Works on deleted videos, as long as you kept the URL.", "Upload time is not filming time — but against “last night”, it is usually enough."]}, {"art": "timeline", "head": "Then find where it lived.", "line": "Keyframes, cropped tight, through four engines. TinEye oldest: November 2021.", "demo": "q3", "shot": {"f": "images/room-case-3.jpg", "c": "Keyframes, cropped, through every engine"}}, {"art": "scanframe", "head": "Is it even Johor?", "line": "Six observations. Tap the ones that contradict the claim.", "demo": "features"}, {"art": "gauge", "head": "The AI check adds nothing.", "line": "No EXIF, no credentials, detector 41%. All expected. All inconclusive.", "demo": "q5"}, {"art": "stamp", "head": "False.", "line": "Footage from a 2021 flood elsewhere, recirculated as last night in Johor Bahru.", "demo": "verdict", "shot": {"f": "images/room-case-6.jpg", "c": "An AFP fact-check, with the verdict on the front of it"}, "more": ["Not “AI-generated” — nothing supports that.", "Not “filmed in November 2021” — you know when it was uploaded, not shot.", "Name the sender only if there is a public-interest reason."]}, {"art": "log", "head": "You built this as you went.", "line": "The artefact your editor asks for, and the one you need when the clip returns.", "demo": "log", "more": ["<b>Cheapest check first.</b> Timestamp, then reverse image, then location. Detectors last.", "<b>Stop when it is settled.</b> The later steps corroborate; they do not decide.", "<b>Record the negatives.</b> “Inconclusive” belongs in the log precisely because it changed nothing."]}]}};

function toolSeq(t){

async function save(){

  const fn=(decodeURIComponent(location.pathname.split("/").pop()||"")||"index.html");
  if(!dirHandle&&window.showDirectoryPicker){ try{ dirHandle=await window.showDirectoryPicker({mode:"readwrite"}); }catch(e){} }
  if(dirHandle){ try{
    const fh=await dirHandle.getFileHandle(fn.endsWith(".html")?fn:"index.html",{create:true});
    const w=await fh.createWritable(); await w.write(html); await w.close(); dirty=false; toast("Saved to file"); return;
  }catch(e){} }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  a.download=fn.endsWith(".html")?fn:"index.html"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); dirty=false; toast("Downloaded");
}

DEMOS.inspect=function(h){

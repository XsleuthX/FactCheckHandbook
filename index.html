<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Factcheck Handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --room:#15171B; --room-2:#1B1E24; --edge:#2B303A; --edge-2:#3A4150;
  --plate:#F3F1EC; --plate-ink:#15171B;
  --label:#9AA2AE; --label-dim:#6B7280;
  --brass:#C9A227; --brass-dim:#8A7228;
  --sage:#7EA890; --clay:#C4635C;
  --serif:"Instrument Serif",Georgia,serif;
  --sans:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
  --step:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--plate);font-family:var(--sans);font-size:16px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--brass);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
::selection{background:var(--brass);color:var(--room)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- scaffold ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.view{position:absolute;inset:0;display:none;flex-direction:column;opacity:0}
.view.on{display:flex;opacity:1;animation:fade .45s var(--step)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- top rail ---------- */
.rail{flex:none;display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;
  border-bottom:1px solid var(--edge)}
.rail .name{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--label);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .sp{margin-left:auto}
.icobtn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--edge);border-radius:2px;color:var(--label);flex:none}
.icobtn:hover{border-color:var(--brass);color:var(--brass)}
.icobtn.act{border-color:var(--brass);color:var(--brass)}

/* ticks */
.ticks{display:flex;gap:4px;flex:1;max-width:340px;margin:0 auto}
.tick{flex:1;height:2px;background:var(--edge-2);border-radius:2px;padding:0;min-width:6px}
.tick.done{background:var(--brass-dim)}
.tick.now{background:var(--brass)}

/* ---------- hall ---------- */
.hall{flex:1;overflow-y:auto;padding:0 20px calc(env(safe-area-inset-bottom) + 40px);display:flex;flex-direction:column;justify-content:center}
.hall-in{width:100%;max-width:900px;margin:0 auto;padding:36px 0}
.overline{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--brass);margin:0 0 18px}
.hall h1{font-family:var(--serif);font-weight:400;font-size:clamp(38px,8.5vw,74px);line-height:.98;letter-spacing:-.015em;margin:0 0 16px}
.hall h1 em{font-style:italic;color:var(--brass)}
.hall .sub{color:var(--label);max-width:38ch;margin:0 0 40px;font-size:16.5px}
.doors{display:grid;gap:1px;background:var(--edge);border:1px solid var(--edge)}
@media(min-width:760px){.doors{grid-template-columns:1fr 1fr}}
.door{display:flex;align-items:center;gap:18px;padding:20px 22px;background:var(--room);text-align:left;transition:background .25s var(--step)}
.door:hover,.door:focus-visible{background:var(--room-2)}
.door svg{flex:none;width:52px;height:52px;color:var(--brass);opacity:.85;transition:transform .35s var(--step)}
.door:hover svg{transform:scale(1.06)}
.door .n{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--label-dim);display:block;margin-bottom:5px}
.door .t{font-family:var(--serif);font-size:25px;line-height:1.05;display:block}
.door .d{color:var(--label);font-size:13.5px;display:block;margin-top:5px}

/* ---------- stage ---------- */
.stage{flex:1;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;
  padding:0 20px calc(env(safe-area-inset-bottom) + 96px)}
.panel{width:100%;max-width:620px;margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:center;padding:26px 0 10px}
.plate{display:grid;place-items:center;margin:0 auto 30px;width:min(300px,62vw)}
.plate svg{width:100%;height:auto;color:var(--brass)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--label-dim);margin:0 0 12px;text-align:center}
.head{font-family:var(--serif);font-weight:400;font-size:clamp(30px,7.4vw,46px);line-height:1.02;letter-spacing:-.012em;
  margin:0 0 14px;text-align:center;text-wrap:balance}
.head em{font-style:italic;color:var(--brass)}
.line{color:var(--label);font-size:17px;line-height:1.6;text-align:center;margin:0 auto;max-width:34ch;text-wrap:pretty}
.badges{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.badge{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  border:1px solid var(--edge-2);padding:5px 10px;border-radius:2px;color:var(--label)}
.badge.can{border-color:rgba(126,168,144,.5);color:var(--sage)}
.badge.cant{border-color:rgba(196,99,92,.45);color:var(--clay)}

/* more drawer */
.more{margin:26px auto 0;max-width:38ch;width:100%}
.more-t{display:flex;align-items:center;gap:8px;margin:0 auto;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--label-dim);padding:8px 0}
.more-t:hover{color:var(--brass)}
.more-t .car{transition:transform .3s var(--step)}
.more.open .more-t .car{transform:rotate(180deg)}
.more-b{display:none;border-top:1px solid var(--edge);padding-top:14px}
.more.open .more-b{display:block;animation:fade .35s var(--step)}
.more-b ul{margin:0;padding:0;list-style:none;display:grid;gap:11px}
.more-b li{color:var(--label);font-size:14.5px;line-height:1.55;padding-left:16px;position:relative}
.more-b li:before{content:"";position:absolute;left:0;top:9px;width:6px;height:1px;background:var(--brass-dim)}
.more-b b,.more-b strong{color:var(--plate);font-weight:500}

/* action + links */
.acts{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:24px}
.act{font-family:var(--sans);font-size:13.5px;font-weight:500;padding:10px 16px;border:1px solid var(--edge-2);
  border-radius:2px;color:var(--plate);text-decoration:none;display:inline-flex;align-items:center;gap:7px;
  transition:border-color .2s,color .2s,background .2s}
.act:hover{border-color:var(--brass);color:var(--brass)}
.act.key{background:var(--brass);border-color:var(--brass);color:var(--room);font-weight:600}
.act.key:hover{background:#DDB62F;border-color:#DDB62F;color:var(--room)}
.act:disabled{opacity:.35;cursor:default}

/* ---------- bottom bar ---------- */
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:14px;
  padding:12px 20px calc(env(safe-area-inset-bottom) + 14px);
  background:linear-gradient(to top,var(--room) 62%,rgba(21,23,27,0));pointer-events:none}
.foot > *{pointer-events:auto}
.step-of{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--label-dim);margin:0 auto}
.arrow{width:44px;height:44px;border:1px solid var(--edge-2);border-radius:50%;display:grid;place-items:center;color:var(--plate)}
.arrow:hover:not(:disabled){border-color:var(--brass);color:var(--brass)}
.arrow:disabled{opacity:.25;cursor:default}

/* ---------- demos ---------- */
.demo{width:100%;max-width:420px;margin:22px auto 0;border:1px solid var(--edge);background:var(--room-2);padding:16px}
.demo.wide{max-width:520px}
.f{display:grid;gap:6px;margin-bottom:12px}
.f label{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--label-dim)}
.f input{padding:10px 11px;border:1px solid var(--edge-2);background:var(--room);color:var(--plate);
  border-radius:2px;font-family:var(--mono);font-size:14px;width:100%}
.f input:focus{border-color:var(--brass);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.read{font-family:var(--mono);font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;
  color:var(--label);border-top:1px solid var(--edge);margin-top:14px;padding-top:13px}
.read b{color:var(--brass);font-weight:500}
.read i{color:var(--plate);font-style:normal}
.rng{width:100%;accent-color:var(--brass);background:transparent}
.rngrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.rngrow output{font-family:var(--mono);font-size:13px;color:var(--brass);min-width:64px;text-align:right}
.drop{border:1px dashed var(--edge-2);background:var(--room);min-height:120px;display:grid;place-items:center;gap:7px;
  padding:22px;text-align:center;cursor:pointer;border-radius:2px}
.drop:hover,.drop.over{border-color:var(--brass)}
.drop .h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--label)}
.drop .s{font-size:12.5px;color:var(--label-dim)}
.cstage{position:relative;display:none;touch-action:none;user-select:none;line-height:0;background:#0B0C0F}
.cstage.on{display:block}
.cstage canvas{width:100%;height:auto;display:block}
.csel{position:absolute;border:1px solid var(--brass);box-shadow:0 0 0 9999px rgba(11,12,15,.66);display:none}
.csel.on{display:block}
.cout{margin-top:12px;display:none}
.cout.on{display:block}
.cout img{max-width:100%;border:1px solid var(--edge-2);display:block}
.taps{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.tap{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;
  border:1px solid var(--edge);background:var(--room);border-radius:2px;font-size:14.5px;color:var(--label);line-height:1.4}
.tap:hover{border-color:var(--edge-2);color:var(--plate)}
.tap .bx{flex:none;width:15px;height:15px;border:1px solid var(--edge-2);margin-top:2px;display:grid;place-items:center;
  font-size:10px;color:transparent;border-radius:1px}
.tap[aria-pressed=true]{border-color:var(--brass);color:var(--plate)}
.tap[aria-pressed=true] .bx{background:var(--brass);border-color:var(--brass);color:var(--room)}
.opts{display:grid;gap:7px}
.opt{text-align:left;padding:12px 14px;border:1px solid var(--edge);border-radius:2px;font-size:14.5px;color:var(--label);line-height:1.4}
.opt:hover{border-color:var(--edge-2);color:var(--plate)}
.opt.right{border-color:var(--sage);color:var(--plate)}
.opt.wrong{border-color:var(--clay);color:var(--plate)}
.verdict{font-family:var(--serif);font-size:21px;line-height:1.25;color:var(--plate);border-left:2px solid var(--brass);
  padding-left:14px;margin:18px auto 0;max-width:34ch;text-align:left}
.logl{list-style:none;margin:0;padding:0;display:grid;gap:1px;background:var(--edge)}
.logl li{background:var(--room);padding:11px 13px;display:grid;grid-template-columns:auto 1fr;gap:12px;font-size:13.5px;color:var(--label)}
.logl .t{font-family:var(--mono);font-size:10.5px;color:var(--brass);padding-top:3px}
.logl .empty{display:block;text-align:center;color:var(--label-dim);font-size:13.5px}

/* ---------- index ---------- */
.idx{flex:1;overflow-y:auto;padding:0 20px calc(env(safe-area-inset-bottom) + 40px)}
.idx-in{max-width:820px;margin:0 auto;padding:26px 0 10px}
.idx h2{font-family:var(--serif);font-weight:400;font-size:34px;margin:0 0 6px}
.idx .sub{color:var(--label);margin:0 0 26px;font-size:15px}
.fam{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--label-dim);
  margin:30px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--edge)}
.tools{display:grid;gap:1px;background:var(--edge);border:1px solid var(--edge)}
@media(min-width:680px){.tools{grid-template-columns:1fr 1fr}}
.tool{display:flex;align-items:center;gap:14px;padding:15px 16px;background:var(--room);text-align:left}
.tool:hover{background:var(--room-2)}
.tool svg{width:26px;height:26px;flex:none;color:var(--brass);opacity:.8}
.tool .n{font-family:var(--mono);font-size:10px;color:var(--label-dim);display:block}
.tool .t{font-size:15px;display:block;margin-top:2px;color:var(--plate)}
.tool .p{font-size:12.5px;color:var(--label-dim);display:block}

/* ---------- edit ---------- */
body.ed [data-b]{outline:1px dashed transparent;border-radius:2px}
body.ed [data-b]:hover{outline-color:var(--edge-2)}
body.ed [data-b]:focus{outline:1px solid var(--brass);background:rgba(201,162,39,.06)}
.saved{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--brass);color:var(--room);
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:8px 16px;
  border-radius:2px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
.saved.on{opacity:1}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 70px);text-align:center;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--label-dim);
  pointer-events:none;opacity:0;transition:opacity .6s}
.hint.on{opacity:1}
</style>

.hall{padding-top:20px}.hall-in{max-width:1080px}.overline{display:inline-flex;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.72);color:var(--brass);letter-spacing:.18em}.hall h1{font-family:var(--sans);font-weight:600;max-width:12ch;font-size:clamp(44px,8vw,82px);letter-spacing:-.055em;line-height:.94}.hall h1 em{color:var(--brass)}.hall .sub{color:var(--label);font-size:17px}.doors{gap:12px;background:transparent;border:0;grid-template-columns:repeat(2,1fr)}.door{border-radius:22px;background:rgba(255,255,255,.78);border:1px solid rgba(120,131,165,.13);box-shadow:0 15px 38px rgba(61,66,99,.08);padding:21px}.door:hover,.door:focus-visible{background:#fff;transform:translateY(-2px);box-shadow:0 20px 42px rgba(61,66,99,.12)}.door svg{color:var(--brass);background:#F0ECFF;border-radius:17px;padding:10px}.door .n{color:var(--brass)}.door .t{font-family:var(--sans);font-weight:600;font-size:22px}.door .d{color:var(--label)}
.stage{padding-bottom:100px}.panel{max-width:780px;padding-top:36px}.plate{width:min(180px,40vw);margin-bottom:21px;background:rgba(255,255,255,.66);border:1px solid rgba(120,131,165,.13);border-radius:28px;padding:20px;box-shadow:0 14px 34px rgba(61,66,99,.08)}.plate svg{color:var(--brass)}.eyebrow{color:var(--brass)}.head{font-family:var(--sans);font-weight:600;letter-spacing:-.035em}.head em{color:var(--brass)}.line{color:var(--label)}.badge{border:0;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px rgba(120,131,165,.15)}.badge.can{color:var(--sage)}.badge.cant{color:var(--clay)}

<body>

<div id="app">
  <!-- HALL -->
  <section class="view on" id="v-hall">
    <div class="homebar"><span class="homebrand">Verification Desk</span><div class="homechips"><button data-room="img">Images +</button><button data-room="geo">Location +</button><button data-room="ai">AI +</button><button data-room="index">All tools +</button></div></div>
    <div class="hall"><div class="hall-in">
      <p class="overline">Verification Desk</p>
      <h1>Fact Check<br>One at a <em>time</em>.</h1>
      <p class="sub">Step by step tutorial with useful tools and links</p>
      <div class="doors" id="doors"></div>
    </div></div>
  </section>

  <!-- STAGE -->
  <section class="view" id="v-stage">
    <div class="rail">
      <button class="icobtn" id="s-close" title="Back to the hall" aria-label="Back to the hall">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg></button>

let view="hall", room=null, step=0, seq=[], editing=false, dirHandle=null, dirty=false, selfHash=false;
function setHash(h){ selfHash=true; location.hash=h; setTimeout(function(){selfHash=false;},0); }
const $ = id => document.getElementById(id);

function show(v){
  view=v;
  ["v-hall","v-stage","v-index"].forEach(id=>$(id).classList.toggle("on", id==="v-"+v));
}
function firstSentence(html){
  const t=html.replace(/<[^>]+>/g,"");
  const m=t.match(/^(.{20,150}?[.!?])(\s|$)/);
  return m ? m[1] : (t.length>150 ? t.slice(0,140)+"…" : t);
}
function restAfterLead(html){
  const t=html.replace(/<[^>]+>/g,""); const lead=firstSentence(html);
  const rest=t.slice(lead.length).trim();
  return rest ? [rest] : [];
}

/* build the step sequence for a tool from stored data */
function toolSeq(t){
  const glyph = TOOLART[t.id] || "g_search";
  const out=[];
  out.push({art:glyph, eye:t.num+" · "+t.platform, head:t.title.split("—")[0].trim(),
    line:firstSentence(t.purpose), badges:[...(t.yes||[]).slice(0,2).map(x=>["can",x]), ...(t.no||[]).slice(0,2).map(x=>["cant",x])],
    more:[...restAfterLead(t.purpose)], bind:{line:null}});
  if(t.images && t.images[0] && t.images[0].f){
    out.push({art:glyph, eye:"AFP workshop example", head:"See the interface in context.",
      line:t.images[0].c, image:t.images[0]});
  }
  (t.steps||[]).forEach((st,i)=>{
    out.push({art:glyph, eye:"Step "+String(i+1).padStart(2,"0")+" of "+String(t.steps.length).padStart(2,"0"),
      head:null, lead:firstSentence(st.t), rest:restAfterLead(st.t), full:st.t, code:st.c,
      bind:{full:"sections."+TOOLS.indexOf(t)+".steps."+i+".t"}});
  });
  if(t.ops && t.ops.length) out.push({art:"g_dork", eye:"Reference", head:"Copy what you need.",
    line:"Tap any line to copy it.", ops:t.ops});
  if(t.notes && t.notes.length) out.push({art:"stripped", eye:"Before you rely on this", head:"Watch out.",
    line:null, more:t.notes, openMore:true});
  if(t.links && t.links.length) out.push({art:glyph, eye:"Open it", head:"Go and use it.",
    line:null, acts:t.links.map(l=>[l[0],l[1]])});
  return out;
}

function openRoom(key){
  if(key==="index"){ renderIndex(); show("index"); setHash("#index"); return; }
  if(key.indexOf("tool/")===0){
    const t=TOOLS.find(x=>x.id===key.slice(5)); if(!t) return;
    room={name:t.num+" · "+t.title.split("—")[0].trim(), key:key}; seq=toolSeq(t);
  } else {
    const r=ROOMS[key]; if(!r) return;
    room={name:r.name, key:key}; seq=r.steps;
  }
  step=0; show("stage"); paint(); setHash("#"+(room.key.indexOf("tool/")===0?room.key:"room/"+room.key));
  $("s-hint").classList.add("on"); setTimeout(()=>$("s-hint").classList.remove("on"),2600);
}

function paint(){
  const s=seq[step];
  $("s-name").textContent=room.name;
  $("s-of").textContent=String(step+1).padStart(2,"0")+" / "+String(seq.length).padStart(2,"0");
  $("s-ticks").innerHTML=seq.map((_,i)=>'<button class="tick '+(i<step?"done":i===step?"now":"")+'" data-go="'+i+'" aria-label="Step '+(i+1)+'"></button>').join("");
  $("s-prev").disabled=step===0; $("s-next").disabled=step===seq.length-1;

  let h='<div class="plate">'+(ART[s.art]||ART.g_search)+'</div>';
  h+='<p class="eyebrow">'+(s.eye||room.name)+'</p>';
  if(s.head) h+='<h2 class="head">'+s.head+'</h2>';
  if(s.full!==undefined){
    if(editing) h+='<p class="line" data-b="'+s.bind.full+'">'+s.full+'</p>';
    else h+='<p class="line">'+s.lead+'</p>';
  }
  else if(s.line) h+='<p class="line">'+s.line+'</p>';
  if(s.code) h+='<div class="acts"><button class="act copy" data-copy="'+String(s.code).replace(/"/g,"&quot;")+'"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12"/><path d="M5 15V3h12"/></svg><span class="mono" style="font-family:var(--mono);font-size:12.5px">'+String(s.code).replace(/</g,"&lt;")+'</span></button></div>';
  if(s.badges && s.badges.length) h+='<div class="badges">'+s.badges.map(b=>'<span class="badge '+b[0]+'">'+b[1].replace(/<[^>]+>/g,"")+'</span>').join("")+'</div>';
  if(s.image) h+='<figure class="tool-shot"><img src="images/'+String(s.image.f).replace(/"/g,"&quot;")+'" alt="'+String(s.image.c||"").replace(/"/g,"&quot;")+'"><figcaption>'+String(s.image.c||"")+'</figcaption></figure>';
  if(s.ops) h+='<div class="demo wide"><div class="taps">'+s.ops.map(o=>'<button class="tap copy" data-copy="'+String(o[0]).replace(/"/g,"&quot;")+'"><span class="bx">✓</span><span><span style="font-family:var(--mono);font-size:12.5px;color:var(--brass)">'+String(o[0]).replace(/</g,"&lt;")+'</span><br>'+o[1]+'</span></button>').join("")+'</div></div>';
  if(s.demo) h+='<div id="demoslot"></div>';
  if(s.acts) h+='<div class="acts">'+s.acts.map(a=>{
    const ext=a[1].indexOf("http")===0;
    return '<a class="act'+(ext?"":" key")+'" href="'+a[1]+'"'+(ext?' target="_blank" rel="noopener"':'')+'>'+a[0]+(ext?' ↗':' →')+'</a>';
  }).join("")+'</div>';
  const extra = (s.more||[]).concat(!editing && s.rest ? s.rest : []);
  if(extra.length) h+='<div class="more'+(s.openMore?" open":"")+'"><button class="more-t">More <svg class="car" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 9l7 7 7-7"/></svg></button><div class="more-b"><ul>'+extra.map(m=>'<li>'+m+'</li>').join("")+'</ul></div></div>';

  const p=$("s-panel"); p.innerHTML=h; $("s-stage").scrollTop=0;
  if(s.demo && DEMOS[s.demo]) DEMOS[s.demo]($("demoslot"));
  applyEdit();
}
function go(n){ if(n<0||n>=seq.length) return; step=n; paint(); }

/* nav wiring */
$("s-prev").onclick=()=>go(step-1);
$("s-next").onclick=()=>go(step+1);
$("s-close").onclick=()=>{ show("hall"); setHash(""); };
$("i-close").onclick=()=>{ show("hall"); setHash(""); };
$("s-ticks").addEventListener("click",e=>{ const b=e.target.closest("[data-go]"); if(b) go(+b.dataset.go); });
document.addEventListener("keydown",e=>{
  if(view!=="stage"||e.target.matches("input,textarea,[contenteditable=true]")) return;
  if(e.key==="ArrowRight") go(step+1);
  if(e.key==="ArrowLeft") go(step-1);
  if(e.key==="Escape") { show("hall"); setHash(""); }
});
/* swipe */
(function(){
  let x0=null,y0=null;
  const st=$("s-stage");
  st.addEventListener("touchstart",e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
  st.addEventListener("touchend",e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.6) go(step + (dx<0?1:-1));
    x0=null;
  },{passive:true});
})();
/* more + copy (delegated) */
document.addEventListener("click",e=>{
  const m=e.target.closest(".more-t"); if(m){ m.closest(".more").classList.toggle("open"); return; }
  const c=e.target.closest(".copy"); if(c && !editing){
    const txt=c.dataset.copy;
    const flash=()=>{ c.style.borderColor="var(--sage)"; setTimeout(()=>c.style.borderColor="",900); };
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(flash).catch(()=>{});
  }
});

/* ---------- hash routing ---------- */
function route(){
  const h=location.hash.replace(/^#/,"");
  if(!h){ show("hall"); return; }
  if(h==="index"){ renderIndex(); show("index"); return; }
  if(h.indexOf("room/")===0){ openRoom(h.slice(5)); return; }
  if(h.indexOf("tool/")===0){ openRoom(h); return; }
  const t=TOOLS.find(x=>x.id===h); if(t) openRoom("tool/"+t.id);
}

function get(p){ return p.split(".").reduce((o,k)=>o==null?o:o[k],DATA); }
function setV(p,v){ const ks=p.split("."),l=ks.pop(); ks.reduce((a,k)=>a[k],DATA)[l]=v; }
function applyEdit(){
  document.body.classList.toggle("ed",editing);
  document.querySelectorAll("[data-b]").forEach(el=>{
    if(editing) el.setAttribute("contenteditable","true"); else el.removeAttribute("contenteditable");
  });
  $("s-edit").classList.toggle("act",editing);
}
document.addEventListener("input",e=>{
  const el=e.target.closest("[data-b]"); if(!el||!editing) return;
  setV(el.dataset.b, el.innerHTML); dirty=true;
});
$("s-edit").onclick=()=>{ editing=!editing; if(view==="stage") paint(); applyEdit(); };
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1800); }
function serialize(){
  const json=JSON.stringify(DATA,null,1).replace(/<\//g,"<\\/");
  $("data").textContent=json;
  const p=$("s-panel").innerHTML, i=$("i-body").innerHTML, d=$("doors").innerHTML, tk=$("s-ticks").innerHTML;
  $("s-panel").innerHTML=""; $("i-body").innerHTML=""; $("doors").innerHTML=""; $("s-ticks").innerHTML="";
  document.querySelectorAll("[contenteditable]").forEach(el=>el.removeAttribute("contenteditable"));
  const cls=document.body.className; document.body.className="";
  document.querySelectorAll(".view").forEach((v,n)=>v.classList.toggle("on",n===0));
  const html="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
  document.body.className=cls;
  $("s-panel").innerHTML=p; $("i-body").innerHTML=i; $("doors").innerHTML=d; $("s-ticks").innerHTML=tk;
  show(view); applyEdit();
  return html;
}
async function save(){
  const html=serialize();
  const fname=(decodeURIComponent(location.pathname.split("/").pop()||"")||"index.html");
  if(!dirHandle && window.showDirectoryPicker){
    try{ dirHandle=await window.showDirectoryPicker({mode:"readwrite"}); }catch(err){}
  }
  if(dirHandle){
    try{
      const fh=await dirHandle.getFileHandle(fname.endsWith(".html")?fname:"index.html",{create:true});
      const w=await fh.createWritable(); await w.write(html); await w.close();
      dirty=false; toast("Saved to file"); return;
    }catch(err){}
  }
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  a.download=fname.endsWith(".html")?fname:"index.html"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  dirty=false; toast("Downloaded");
}
$("s-save").onclick=save; $("i-save").onclick=save;
document.addEventListener("keydown",e=>{ if((e.metaKey||e.ctrlKey)&&e.key==="s"){ e.preventDefault(); save(); } });
window.addEventListener("beforeunload",e=>{ if(dirty){ e.preventDefault(); e.returnValue=""; } });

      L.push("");
      if(K.length){ K.forEach(k=>L.push("<b>"+k+"</b>".padEnd(4)+"  "+String(info[k]).slice(0,34))); }
      else L.push("<b>No EXIF.</b>\n<i>Normal after any platform upload.</i>");
      L.push("");
      L.push(G?"<b>GPS</b>  "+G.lat.toFixed(5)+", "+G.lon.toFixed(5)+"\n<i>WGS-84 — convert for Chinese maps.</i>":"<b>No GPS.</b>");
      L.push("");
      L.push(c2?"<b>C2PA marker found.</b>\n<i>Verify the signature below.</i>":"<b>No credentials.</b>\n<i>Absence proves nothing.</i>");
      out.innerHTML=L.join("\n"); out.style.display="block"; acts.style.display="flex"; dz.style.display="none";
    };
    fr.readAsArrayBuffer(file);
  }
};

/* --- score --- */
DEMOS.score=function(host){
  host.innerHTML='<div class="demo"><div class="rngrow"><input class="rng" id="ds" type="range" min="0" max="100" value="72"><output id="dv">72%</output></div><div class="read" id="dt"></div></div>';
  const s=host.querySelector("#ds"), o=host.querySelector("#dv"), t=host.querySelector("#dt");
  function run(){
    const v=+s.value; o.textContent=v+"%";
    t.innerHTML = v<25 ? "<b>You may say</b>\nNo strong indicators found.\n\n<b>You may not say</b>\nThis is authentic."
      : v<60 ? "<b>You may say</b>\nInconclusive.\n\n<b>You may not say</b>\nAnything else. This is noise."
      : v<85 ? "<b>You may say</b>\nWorth investigating — here is what we did next.\n\n<b>You may not say</b>\nThis is AI-generated."
      : "<b>You may say</b>\nTwo independent detectors agree, and so does the provenance.\n\n<b>You may not say</b>\nThe number. Ever.";
  }
  s.addEventListener("input",run); run();
};

/* --- domain --- */
DEMOS.domain=function(host){
  host.innerHTML='<div class="demo"><div class="f"><label>Domain</label><input id="dm" type="text" inputmode="url" placeholder="example.com"></div>'+
    '<div class="acts"><button class="act key" id="db">Build the checks</button></div><div id="do"></div></div>';
  const C=[["Registered",d=>"https://who.is/whois/"+d],["Archive",d=>"https://web.archive.org/web/*/"+d+"/*"],
    ["First capture",d=>"https://web.archive.org/web/1996/http://"+d],["Certificates",d=>"https://crt.sh/?q="+encodeURIComponent(d)],
    ["Who links in",d=>"https://www.google.com/search?q="+encodeURIComponent('"'+d+'" -site:'+d)],
    ["What it publishes",d=>"https://www.google.com/search?q="+encodeURIComponent("site:"+d)],
    ["Live scan",d=>"https://urlscan.io/search/#"+encodeURIComponent(d)],["DNS",d=>"https://www.whatsmydns.net/#A/"+d]];
  const i=host.querySelector("#dm"), o=host.querySelector("#do");
  function run(){
    const d=i.value.trim().toLowerCase().replace(/^https?:\/\//,"").replace(/\/.*$/,"").replace(/^www\./,"");
    if(!d||d.indexOf(".")<1){ o.innerHTML='<div class="read">Enter a domain.</div>'; return; }
    o.innerHTML='<div class="acts">'+C.map(c=>'<a class="act" href="'+c[1](d)+'" target="_blank" rel="noopener">'+c[0]+' ↗</a>').join("")+'</div>';
  }
  host.querySelector("#db").onclick=run;
  i.addEventListener("keydown",e=>{ if(e.key==="Enter") run(); });
};

/* --- case demos --- */
function mcq(host,opts,correct,fbGood,fbBad,log){
  host.innerHTML='<div class="demo wide"><div class="opts">'+opts.map((o,i)=>'<button class="opt" data-i="'+i+'">'+o+'</button>').join("")+
    '</div><div class="read" id="mo" style="display:none"></div></div>';
  const out=host.querySelector("#mo"); let done=false;
  host.addEventListener("click",e=>{
    const b=e.target.closest(".opt"); if(!b||done) return; done=true;
    const p=+b.dataset.i;
    host.querySelectorAll(".opt").forEach((o,i)=>{ if(i===correct) o.classList.add("right"); });
    if(p!==correct) b.classList.add("wrong");
    out.style.display="block";
    out.innerHTML=(p===correct?"<b>Correct.</b>\n":"<b>Not quite.</b>\n"+fbBad[p]+"\n\n")+fbGood;
    if(log) addLog(log[0],log[1]);
  });
}
DEMOS.brief=function(host){
  mcq(host,["Ask the sender where they got it","Archive it, then get the upload time","Check whether it rained in JB","Run an AI detector"],1,
    "Archiving costs ten seconds and the post may be gone by lunchtime. The upload time is the next cheapest thing you can know.",
    {0:"Worth doing — later. Senders rarely know the origin, and asking first burns time while the post can still be deleted.",
     2:"Real weather plus old footage is exactly how these clips work. It proves nothing either way.",
     3:"The most expensive check, and the least conclusive. Last, if at all."},
    ["08:16","Archived the TikTok URL before doing anything else."]);
};
DEMOS.tiktok=function(host){
  host.innerHTML='<div class="demo"><div class="f"><label>Video URL or ID</label><input id="tu" type="text" inputmode="url" placeholder="tiktok.com/@user/video/7123…"></div>'+
    '<div class="acts"><button class="act key" id="tb">Decode</button><button class="act" id="tc">Use the case video</button></div>'+
    '<div class="read" id="to" style="display:none"></div></div>';
  const u=host.querySelector("#tu"), o=host.querySelector("#to");
  function run(){
    const m=String(u.value).match(/(\d{17,20})/); o.style.display="block";
    if(!m){ o.innerHTML="<b>No video ID found.</b>"; return; }
    let ts; try{ ts=Number(BigInt(m[1])>>32n); }catch(e){ o.innerHTML="<b>Unreadable ID.</b>"; return; }
    if(!ts||ts<1400000000||ts>2000000000){ o.innerHTML="<b>Not a plausible date.</b>\n<i>Check you copied the video ID.</i>"; return; }
    const f=x=>new Date(x*1000).toISOString().slice(0,16).replace("T"," ");
    const days=Math.floor((Date.now()/1000-ts)/86400);
    o.innerHTML="<b>Uploaded</b>  "+f(ts)+" UTC\n<b>Local</b>     "+f(ts+8*3600)+" SGT\n<b>Age</b>       "+days.toLocaleString()+" days\n\n"+
      (days>2?"<i>Not last night. It was already online "+days.toLocaleString()+" days ago.</i>":"<i>Fresh — but that says nothing about when it was filmed.</i>");
    if(m[1]===CASE_ID) addLog("08:22","Video ID decodes to "+f(ts)+" UTC. Claim of “last night” contradicted at the first check.");
  }
  host.querySelector("#tb").onclick=run;
  host.querySelector("#tc").onclick=()=>{ u.value="https://www.tiktok.com/@user/video/"+CASE_ID; run(); };
  u.addEventListener("keydown",e=>{ if(e.key==="Enter") run(); });
};
DEMOS.q3=function(host){
  mcq(host,["It was filmed in November 2021","That 2021 news site is the original source","It existed online by November 2021, so it is not from last night","Nothing — TinEye dates are unreliable"],2,
    "An earliest-indexed date is an upper bound. The footage existed by then. It does not tell you when it was filmed, or who shot it.",
    {0:"Overreach. November 2021 is when a copy was indexed, not when the camera rolled.",
     1:"You found the earliest indexed copy, which is not the same as the original. Check whether that site credits anyone.",
     3:"TinEye's oldest date is one of the more reliable signals you have. Use it — as an upper bound."},
    ["08:31","Keyframes through four engines. TinEye oldest: same frames published November 2021, different country."]);
};
DEMOS.features=function(host){
  const F=[["A road sign in Thai script",1],["Traffic driving on the left",0],["A songthaew pickup taxi",1],
    ["Palm trees and monsoon rain",0],["A shopfront number starting +66",1],["Dry pavement two streets back",1]];
  host.innerHTML='<div class="demo"><ul class="taps">'+F.map((f,i)=>'<li><button class="tap" aria-pressed="false" data-g="'+f[1]+'"><span class="bx">✓</span><span>'+f[0]+'</span></button></li>').join("")+
    '</ul><div class="read" id="fo">Tap what contradicts the claim.</div></div>';
  const o=host.querySelector("#fo");
  host.addEventListener("click",e=>{
    const b=e.target.closest(".tap"); if(!b) return;
    b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true"));
    const on=[...host.querySelectorAll('[aria-pressed="true"]')];
    const hit=on.filter(x=>x.dataset.g==="1").length, miss=on.filter(x=>x.dataset.g==="0").length;
    let m="<b>"+hit+" of 4</b> contradictions";
    if(miss) m+="\n\n<i>Left-hand traffic and monsoon rain are consistent with Johor — and with half of Southeast Asia. Consistent is not confirming.</i>";
    if(hit===4&&!miss){ m+="\n\n<i>Thai script, a songthaew and a +66 number put this in Thailand. Dry pavement two streets back contradicts the footage itself.</i>";
      addLog("08:44","Frame inventory: Thai signage, songthaew, +66 number, dry pavement nearby. Location inconsistent with Johor Bahru."); }
    o.innerHTML=m;
  });
};
DEMOS.q5=function(host){
  mcq(host,["It confirms the footage is authentic","Nothing to the verdict — but it closes the question before it is asked","It shows the video was manipulated","It strengthens the timestamp finding"],1,
    "It changes no conclusion. You still run it, because the first question in the newsroom will be “could it be AI?” — and a logged, inconclusive check answers that in one line.",
    {0:"41% cannot confirm authenticity any more than it can confirm generation.",
     2:"41% is the model saying it does not know. Reading that as manipulation is the commonest mistake with these tools.",
     3:"It sits alongside the timestamp, independent of it. Two weak signals do not compound into a strong one."},
    ["08:52","No EXIF, no C2PA (both expected). Detector 41% — inconclusive, no weight given."]);
};
DEMOS.verdict=function(host){
  host.innerHTML='<p class="verdict">The clip was uploaded on 18 November 2021, more than four years before the flooding it claims to show. Signage and vehicle types are inconsistent with Johor Bahru.</p>';
  addLog("09:05","Verdict: false. Recirculated 2021 footage, wrong country.");
};
DEMOS.log=function(host){
  const draw=()=>{
    host.innerHTML='<div class="demo wide"><ul class="logl">'+
      (CASELOG.length?CASELOG.map(l=>'<li><span class="t">'+l.t+'</span><span>'+l.x+'</span></li>').join("")
        :'<li><span class="empty">Work the room and your log fills in here.</span></li>')+
      '</ul><div class="acts"><button class="act key" id="lc">Copy the log</button><button class="act" id="lr">Clear</button></div></div>';
    host.querySelector("#lc").onclick=async()=>{
      const b=host.querySelector("#lc");
      if(!CASELOG.length){ b.textContent="Nothing yet"; setTimeout(()=>b.textContent="Copy the log",1600); return; }
      const txt="VERIFICATION LOG — training scenario\nClaim: flooding in Johor Bahru, forwarded via WhatsApp\n\n"+
        CASELOG.map(l=>l.t+"  "+l.x).join("\n");
      try{ await navigator.clipboard.writeText(txt); b.textContent="Copied ✓"; }catch(e){ b.textContent="Copy failed"; }
      setTimeout(()=>b.textContent="Copy the log",1600);
    };
    host.querySelector("#lr").onclick=()=>{ CASELOG.length=0; draw(); };
  };
  draw();
};
